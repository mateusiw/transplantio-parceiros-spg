// ── IMPORTAR TRANSPLANTIOS COLADOS DO WHATSAPP ───────────────
function _normStr(s) { return (s || '').toString().normalize('NFD').replace(new RegExp('[̀-ͯ]', 'g'), '').toLowerCase().trim(); }

function _waConverterData(d, m, y) {
  d = d.padStart(2, '0'); m = m.padStart(2, '0');
  if (!y) y = String(new Date().getFullYear());
  else if (y.length === 2) y = '20' + y;
  return `${y}-${m}-${d}`;
}

function _parseWhatsAppTexto(texto) {
  const linhas = (texto || '').split(/\n+/).map(l => l.trim()).filter(Boolean);
  const resultado = [];
  linhas.forEach(linha => {
    if (/^total\b/i.test(linha)) return;
    const mData = linha.match(/(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\s*$/);
    if (!mData) return;
    const dataISO = _waConverterData(mData[1], mData[2], mData[3]);
    let resto = linha.slice(0, mData.index).trim();
    resto = resto.replace(/ent\w*\s*=?\s*$/i, '').trim();
    const mNome = resto.match(/^([^\d]+)/);
    if (!mNome) return;
    const nome = mNome[1].trim();
    const meio = resto.slice(mNome[0].length).trim();
    const pares = [...meio.matchAll(/([\d.,]+)\s*(\p{L}+)/gu)];
    pares.forEach(p => {
      const qtd = parseInt(p[1].replace(/[^\d]/g, ''), 10);
      if (qtd > 0) resultado.push({ parceiro_raw: nome, quantidade: qtd, cultura_raw: p[2], data: dataISO });
    });
  });
  return resultado;
}

function _apelidosDe(p) {
  return (p.apelidos || '').split(',').map(a => _normStr(a)).filter(Boolean);
}

function _matchParceiro(nomeRaw) {
  const alvo  = _normStr(nomeRaw);
  const lista = (Gerente.dados && Gerente.dados.parceiros) || [];
  let m = lista.find(p => _normStr(p.nome_fazenda) === alvo || _apelidosDe(p).includes(alvo));
  if (!m) m = lista.find(p => _normStr(p.nome_fazenda).startsWith(alvo) || alvo.startsWith(_normStr(p.nome_fazenda)));
  if (!m) m = lista.find(p => _normStr(p.nome_fazenda).includes(alvo) || alvo.includes(_normStr(p.nome_fazenda)));
  return m ? m.id_parceiro : '';
}

function _matchCultura(tagRaw) {
  const alvo  = _normStr(tagRaw);
  const lista = (Gerente.dados && Gerente.dados.culturas) || [];
  let m = lista.find(c => _normStr(c.nome_exibicao) === alvo);
  if (!m) m = lista.find(c => _normStr(c.nome_exibicao).includes(alvo));
  if (!m && alvo === 'bro') m = lista.find(c => _normStr(c.nome_exibicao).includes('broc'));
  return m ? m.id_cultura : '';
}

// na lista do WhatsApp toda entrega é de brócolis — "bro"/"master" identificam a variedade, não a cultura
function _culturaBrocolisPadrao() {
  const lista = (Gerente.dados && Gerente.dados.culturas) || [];
  const m = lista.find(c => _normStr(c.nome_exibicao).includes('broc'));
  return m ? m.id_cultura : '';
}

function _matchVariedade(tagRaw) {
  const alvo  = _normStr(tagRaw);
  const lista = (Gerente.dados && Gerente.dados.variedades) || [];
  let m = lista.find(v => _normStr(v.nome_exibicao) === alvo);
  if (!m) m = lista.find(v => _normStr(v.nome_exibicao).includes(alvo) || alvo.includes(_normStr(v.nome_exibicao)));
  return m ? m.id_variedade : '';
}

function gOpenWA() {
  Gerente.waRows = [];
  document.getElementById('waTexto').value = '';
  const wrap = document.getElementById('waPreviewWrap');
  wrap.innerHTML = ''; wrap.classList.add('hidden');
  document.getElementById('waBtnSalvar').textContent = 'Registrar';
  document.getElementById('mWA').classList.add('show');
}

function gAnalisarWA() {
  const parsed = _parseWhatsAppTexto(document.getElementById('waTexto').value);
  if (!parsed.length) { toast('Não encontrei nenhuma linha reconhecível (nome + quantidade + data).', 'error'); return; }
  const rows = parsed.map(p => ({
    incluir: true,
    parceiro_raw: p.parceiro_raw,
    cultura_raw:  p.cultura_raw,
    id_parceiro:  _matchParceiro(p.parceiro_raw),
    id_cultura:   _matchCultura(p.cultura_raw) || _culturaBrocolisPadrao(),
    id_variedade: _matchVariedade(p.cultura_raw),
    quantidade:   p.quantidade,
    data:         p.data
  }));
  Gerente.waRows = rows;
  gRenderWA();
}

function gRenderWA() {
  const wrap      = document.getElementById('waPreviewWrap');
  const parceiros = (Gerente.dados && Gerente.dados.parceiros) || [];
  const culturas  = (Gerente.dados && Gerente.dados.culturas) || [];
  const variedades = (Gerente.dados && Gerente.dados.variedades) || [];
  const rows      = Gerente.waRows || [];
  const semParceiro = rows.filter(r => !r.id_parceiro).length;
  const semCultura  = rows.filter(r => !r.id_cultura).length;
  const avisos = (semParceiro || semCultura)
    ? `<div style="background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;border-radius:8px;padding:8px 10px;font-size:11px;font-weight:600;margin-bottom:10px;">⚠ Confira as linhas em vermelho: ${semParceiro} sem parceiro / ${semCultura} sem cultura reconhecidos.</div>`
    : '';

  const linhas = rows.map((r, i) => {
    const faltando = !r.id_parceiro || !r.id_cultura;
    return `<tr style="${faltando ? 'background:#fef2f2;' : ''}">
      <td style="text-align:center;"><input type="checkbox" ${r.incluir ? 'checked' : ''} onchange="gWACampo(${i},'incluir',this.checked)"></td>
      <td><select class="form-control" style="padding:5px;font-size:11px;" onchange="gWACampo(${i},'id_parceiro',this.value)">
        <option value="">${r.parceiro_raw} (?)</option>
        ${parceiros.map(p => `<option value="${p.id_parceiro}" ${p.id_parceiro === r.id_parceiro ? 'selected' : ''}>${p.nome_fazenda}</option>`).join('')}
      </select></td>
      <td><select class="form-control" style="padding:5px;font-size:11px;" onchange="gWACampo(${i},'id_cultura',this.value)">
        <option value="">${r.cultura_raw} (?)</option>
        ${culturas.map(c => `<option value="${c.id_cultura}" ${c.id_cultura === r.id_cultura ? 'selected' : ''}>${c.nome_exibicao}</option>`).join('')}
      </select></td>
      <td><select class="form-control" style="padding:5px;font-size:11px;" onchange="gWACampo(${i},'id_variedade',this.value)">
        <option value="">Nenhuma</option>
        ${variedades.map(v => `<option value="${v.id_variedade}" ${v.id_variedade === r.id_variedade ? 'selected' : ''}>${v.nome_exibicao}</option>`).join('')}
      </select></td>
      <td><input type="text" inputmode="numeric" class="form-control" style="padding:5px;font-size:11px;width:90px;" value="${fmtNum(r.quantidade)}" oninput="gWACampo(${i},'quantidade',this.value)" onblur="this.value = fmtNum(Gerente.waRows[${i}].quantidade)"></td>
      <td><input type="date" class="form-control" style="padding:5px;font-size:11px;" value="${r.data}" onchange="gWACampo(${i},'data',this.value)"></td>
      <td><button class="btn-icon" onclick="gWARemover(${i})" title="Remover">🗑</button></td>
    </tr>`;
  }).join('');

  wrap.innerHTML = `${avisos}<div id="waResumo" style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:8px 12px;font-size:12px;color:#15803d;font-weight:700;margin-bottom:10px;">${_waResumoHTML()}</div><div class="table-wrap"><table>
      <thead><tr><th></th><th>Parceiro</th><th>Cultura</th><th>Variedade</th><th>Qtd</th><th>Data</th><th></th></tr></thead>
      <tbody>${linhas}</tbody>
    </table></div>`;
  wrap.classList.remove('hidden');
  document.getElementById('waBtnSalvar').textContent = `Registrar (${rows.filter(r => r.incluir).length})`;
}

function _waResumoHTML() {
  const rows = (Gerente.waRows || []).filter(r => r.incluir);
  const parceirosUnicos = new Set(rows.map(r => r.id_parceiro || ('_raw_' + _normStr(r.parceiro_raw))));
  const totalQtd = rows.reduce((s, r) => s + (Number(r.quantidade) || 0), 0);
  return `📊 ${parceirosUnicos.size} parceiro(s) • ${fmtNum(totalQtd)} mudas no total`;
}

function gWACampo(i, campo, valor) {
  if (!Gerente.waRows[i]) return;
  Gerente.waRows[i][campo] = campo === 'quantidade' ? Number(String(valor).replace(/[^\d]/g, '')) || 0 : valor;
  if (campo === 'id_parceiro' || campo === 'id_cultura' || campo === 'incluir') { gRenderWA(); return; }
  const resumoEl = document.getElementById('waResumo');
  if (resumoEl) resumoEl.innerHTML = _waResumoHTML();
}

function gWARemover(i) { Gerente.waRows.splice(i, 1); gRenderWA(); }

function gSalvarWA() {
  const linhas = (Gerente.waRows || []).filter(r => r.incluir);
  if (!linhas.length) { toast('Nenhuma linha selecionada.', 'error'); return; }
  const invalidas = linhas.filter(r => !r.id_parceiro || !r.id_cultura || !r.quantidade || !r.data);
  if (invalidas.length) { toast(`${invalidas.length} linha(s) incompleta(s). Corrija parceiro/cultura/quantidade/data antes de registrar.`, 'error'); return; }

  showLoading(true);
  let ok = 0; const falhas = [];
  linhas.reduce((p, r) => p.then(() =>
    gs('registrarTransplantio', App.token, {
      id_parceiro: r.id_parceiro, data_transplantio: r.data, id_cultura: r.id_cultura,
      id_variedade: r.id_variedade || undefined,

// ── ASSISTENTE IA ─────────────────────────────────────────────
// A chave da API da Groq fica só no localStorage deste navegador — nunca é enviada
// ao Apps Script nem salva no código. O Apps Script só devolve o resumo dos dados
// (obterContextoIA); quem chama a Groq de fato é o próprio navegador (fetch direto).
const IA_MODELO = 'llama-3.3-70b-versatile';

function gOpenIA() {
  document.getElementById('mIA').classList.add('show');
  document.getElementById('iaConfigWrap').classList.toggle('hidden', !!localStorage.getItem('spg_groq_key'));

function gAbrirConfigIA() {

function gSalvarChaveIA() {

function _iaAdicionarMensagem(texto, tipo) {
  const wrap = document.getElementById('iaMensagens');
  const el = document.createElement('div');
  const estiloUser = 'align-self:flex-end;background:var(--verde);color:#fff;';
  const estiloIA   = 'align-self:flex-start;background:#f1f5f9;color:#1e293b;';
  const estiloErro  = 'align-self:flex-start;background:#fee2e2;color:#b91c1c;';
  el.style.cssText = `max-width:85%;padding:10px 14px;border-radius:14px;font-size:13px;white-space:pre-wrap;line-height:1.4;${
    tipo === 'user' ? estiloUser : tipo === 'erro' ? estiloErro : estiloIA}`;
  el.textContent = texto;
  wrap.appendChild(el);
  wrap.scrollTop = wrap.scrollHeight;
  return el;
}

function gPerguntarIA() {
  const input = document.getElementById('iaPergunta');
  const pergunta = input.value.trim();
  if (!pergunta) return;
  const key = localStorage.getItem('spg_groq_key');
  if (!key) { gAbrirConfigIA(); toast('Configure a chave da API primeiro.', 'error'); return; }
  const btn = document.getElementById('iaBtnPerguntar');

  _iaAdicionarMensagem(pergunta, 'user');
  input.value = '';
  const msgCarregando = _iaAdicionarMensagem('Pensando...', 'ia');
  btn.disabled = true;

  gs('obterContextoIA', App.token)
    .then(ctx => fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
      body: JSON.stringify({
        model: IA_MODELO,
        temperature: 0.2,
        messages: [
          { role: 'system', content:
            'Você é o assistente do sistema SPG de controle de transplantio e entrega de brócolis. ' +
            'Responda em português, de forma direta e objetiva, usando SOMENTE os dados fornecidos abaixo. ' +
            'Os dados têm duas seções: "HISTÓRICO REAL DE ENTREGAS" (o que já foi efetivamente entregue e pesado, ' +
            'por parceiro/mês/ano, com kg, unidades, média de g/unidade e número de entregas) e ' +
            '"COLHEITAS PREVISTAS" (plantios feitos que ainda vão ser colhidos, é previsão, não entrega real). ' +
            'Nunca confunda uma com a outra ao responder. ' +
            '"Média da cabeça", "média por cabeça" ou "média por muda" significa a média de g/unidade (peso por muda/unidade entregue). ' +
            'Se a pergunta mencionar um mês sem dizer o ano, use o ano mais recente disponível pra esse mês nos dados, ' +
            'a menos que existam vários anos e fique claro que deveria somar todos — nesse caso, mostre o total e também o detalhamento por ano. ' +
            'Quando a pergunta pedir uma soma, período ou "próximo mês", calcule com cuidado usando as datas ' +
            'informadas (a data de hoje está no topo dos dados). ' +
            'Se não houver dados suficientes para responder com confiança, diga isso claramente em vez de inventar. ' +
            'Formate TODO número igual ou maior que 1000 no padrão brasileiro, com ponto separando milhar (ex.: 9.968, 29.548, 1.200.000) — nunca escreva "9968" sem separador. ' +
            'Essa formatação vale pra QUALQUER número que aparecer na sua resposta, inclusive números que você copiar diretamente dos dados abaixo (eles estão sem separador nos dados brutos — é sua obrigação formatá-los ao escrever a resposta, mesmo em contas intermediárias como "6408 + 3560 = 9968"). ' +
            'Use vírgula para casas decimais quando precisar (ex.: 1.234,5 kg). Isso vale pra kg, unidades e qualquer outro número, mas não pra anos (ex.: 2026 continua sem ponto).\n\n' +
            'DADOS:\n' + ctx.contexto
          },
          { role: 'user', content: pergunta }
        ]
      })
    }))
    .then(async r => {
      const data = await r.json();
      if (!r.ok) throw new Error((data.error && data.error.message) || ('Erro na API da Groq (' + r.status + ').'));
      msgCarregando.textContent = data.choices[0].message.content;
    })
    .catch(e => {
      msgCarregando.textContent = 'Erro: ' + e.message;
      msgCarregando.style.background = '#fee2e2'; msgCarregando.style.color = '#b91c1c';
    })
    .finally(() => { btn.disabled = false; document.getElementById('iaMensagens').scrollTop = 999999; input.focus(); });
}
</script>
<script>
// ── PRD: HISTÓRICO DE ENTREGAS ───────────────────────────────

const MESES_PT = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

function _prdPeriodoAnterior(ano, mes) {
  if (!ano) return null;
  if (mes) {
    let m = Number(mes) - 1, a = Number(ano);
    if (m < 1) { m = 12; a -= 1; }
    return { ano: String(a), mes: String(m) };
  }
  return { ano: String(Number(ano) - 1), mes: '' };
}

function gLoadPRD() {
  const ano      = (document.getElementById('prdFAno') || {}).value || '';
  const mes      = (document.getElementById('prdFMes') || {}).value || '';
  const parceiro = (document.getElementById('prdFPa')  || {}).value || '';
  const classe   = (document.getElementById('prdFCl')  || {}).value || '';

  const stats = document.getElementById('prdStats');
  if (stats) stats.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:16px;color:#94a3b8;font-size:12px;">Carregando dados PRD...</div>';

  const anterior = _prdPeriodoAnterior(ano, mes);
  Gerente._prdParceirosTodos = false;

  Promise.all([
    gsPRD('getEntregasDashboard', App.token, { ano, mes, parceiro, classe }),
    gsPRD('getProjecaoSemanal',   App.token),
    anterior ? gsPRD('getEntregasDashboard', App.token, { ano: anterior.ano, mes: anterior.mes, parceiro, classe }).catch(() => null) : Promise.resolve(null),
    // o backend do PRD não filtra a lista de parceiros pela classe — só o resultado agregado.
    // Com um parceiro específico já selecionado, o próprio "d" vem restrito a ele, então busca
    // à parte (sem parceiro) só pra montar a lista completa de parceiros daquela classe/período.
    parceiro ? gsPRD('getEntregasDashboard', App.token, { ano, mes, parceiro: '', classe }).catch(() => null) : Promise.resolve(null)
  ])
    .then(([d, proj, dAnterior, dListaParceiros]) => gDashPRD(d, proj, dAnterior, dListaParceiros))
    .catch(e => {
      if (stats) stats.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:16px;color:#dc2626;font-size:12px;">Erro PRD: ${e.message}</div>`;
    });
}

function _prdVarPct(atual, anterior) {
  if (anterior === null || anterior === undefined || !anterior) return null;
  return Math.round(((atual - anterior) / anterior) * 100);
}

function _prdBadgeTendencia(atual, anterior) {
  const v = _prdVarPct(atual, anterior);
  if (v === null) return '';
  const seta = v > 0 ? '↑' : v < 0 ? '↓' : '→';
  const cor = v > 0 ? '#16a34a' : v < 0 ? '#dc2626' : '#94a3b8';
  return `<div style="font-size:9px;color:${cor};font-weight:700;margin-top:2px;">${seta} ${Math.abs(v)}% vs período anterior</div>`;
}

// "Sítio Reginaldo" e "Sítio Rafael" são o mesmo sítio que "Sítio Leitão" no PRD Consolidado
// (a fonte não tem apelidos/alias, ela agrupa só pelo texto literal do Parceiro) — mescla os
// três num só antes de montar tabela/gráficos, senão aparecem como parceiros distintos.
const PRD_NOMES_MESCLAR_LEITAO = ['sitio reginaldo', 'sitio rafael'];
function _prdNormalizar(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim(); }

function _prdMesclarSitioLeitao(d) {
  if (!d || !Array.isArray(d.porParceiro)) return;
  const alvo = d.porParceiro.filter(p => PRD_NOMES_MESCLAR_LEITAO.includes(_prdNormalizar(p.parceiro)));
  if (!alvo.length) return;

  const leitao = d.porParceiro.find(p => _prdNormalizar(p.parceiro) === 'sitio leitao');
  const restantes = d.porParceiro.filter(p => p !== leitao && !PRD_NOMES_MESCLAR_LEITAO.includes(_prdNormalizar(p.parceiro)));
  const grupo = leitao ? [leitao, ...alvo] : alvo;

  const pesoKg          = grupo.reduce((s, p) => s + p.peso_kg, 0);
  const unidades        = grupo.reduce((s, p) => s + p.unidades, 0);
  const diasComEntrega  = grupo.reduce((s, p) => s + p.dias_com_entrega, 0);
  const ultimaEntrega   = grupo.reduce((max, p) => (p.ultima_entrega && (!max || p.ultima_entrega > max)) ? p.ultima_entrega : max, null);

  const mesclado = {
    parceiro: 'Sítio Leitão',
    peso_kg: +pesoKg.toFixed(1),
    unidades: unidades,
    media_g_un: unidades > 0 ? Math.round(pesoKg * 1000 / unidades) : null,
    media_kg_dia: diasComEntrega > 0 ? +(pesoKg / diasComEntrega).toFixed(1) : 0,
    dias_com_entrega: diasComEntrega,
    ultima_entrega: ultimaEntrega
  };

  d.porParceiro = [...restantes, mesclado].sort((a, b) => b.peso_kg - a.peso_kg);
  if (d.resumo) d.resumo.total_parceiros = Math.max(0, (d.resumo.total_parceiros || 0) - (grupo.length - 1));
}

function gDashPRD(d, proj, dAnterior, dListaParceiros) {
  _prdMesclarSitioLeitao(d);
  if (dListaParceiros) _prdMesclarSitioLeitao(dListaParceiros);
  Gerente._prdUltimo = { d, proj, dAnterior, dListaParceiros };

  // lista de parceiros do dropdown já respeitando a Classe/Ano/Mês selecionados (o "d.parceiros"
  // do backend é uma lista fixa com todos os parceiros do PRD, sem levar a classe em conta).
  const listaParceirosClasse = ((dListaParceiros || d).porParceiro || []).map(p => p.parceiro).sort((a, b) => a.localeCompare(b, 'pt-BR'));

  // ── atualiza filtros ────────────────────────────────────────
  ['prdFAno','prdFMes','prdFPa','prdFCl'].forEach((id, i) => {
    const el = document.getElementById(id); if (!el) return;
    const curr = el.value;
    const lista = id === 'prdFPa' ? listaParceirosClasse : ([d.anos, d.meses, d.parceiros, d.classes][i] || []);
    el.innerHTML = `<option value="">${['Todos','Todos','Todos','Todas'][i]}</option>`;
    lista.forEach(v => {
      const o = document.createElement('option');
      o.value = v; o.textContent = id === 'prdFMes' ? (MESES_PT[v - 1] || v) : v;
      el.appendChild(o);
    });
    if (curr) el.value = curr;
  });

  // ── na primeira carga, filtra por padrão pela classe "Brócolis" ──
  if (!Gerente._prdClasseInicializada) {
    Gerente._prdClasseInicializada = true;
    const selCl = document.getElementById('prdFCl');
    if (selCl && !selCl.value) {
      const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
      const match = (d.classes || []).find(c => norm(c).includes('brocolis'));
      if (match) { selCl.value = match; gLoadPRD(); return; }
    }
  }

  // ── stats ───────────────────────────────────────────────────
  const r  = d.resumo;
  const ra = dAnterior ? dAnterior.resumo : null;
  const pctDiasParceiro = (r.total_parceiros > 0 && r.dias_periodo > 0)
    ? Math.round((r.total_parceiro_dias / (r.total_parceiros * r.dias_periodo)) * 100) : null;

  const stats = document.getElementById('prdStats');
  if (stats) stats.innerHTML = `
    <div class="stat-card"><div class="stat-icon-circle" style="background:#dcfce7;">🔒</div><div class="stat-value stat-verde">${fmtKg(r.total_kg)}</div><div class="stat-label">Total KG</div><div class="text-muted" style="margin-top:2px;">100% do período</div></div>
    <div class="stat-card"><div class="stat-icon-circle" style="background:#dbeafe;">📦</div><div class="stat-value stat-azul">${fmtNum(r.total_unidades)}</div><div class="stat-label">Unidades</div><div class="text-muted" style="margin-top:2px;">100% do período</div></div>
    <div class="stat-card"><div class="stat-icon-circle" style="background:#fef3c7;">📈</div><div class="stat-value stat-ambar">${fmtKg(r.media_kg_dia)}</div><div class="stat-label">Média KG/Dia</div>${ra ? _prdBadgeTendencia(r.media_kg_dia, ra.media_kg_dia) : ''}</div>
    <div class="stat-card"><div class="stat-icon-circle" style="background:#fef3c7;">📅</div><div class="stat-value stat-ambar">${fmtKg(r.media_kg_semana)}</div><div class="stat-label">Média KG/Semana</div>${ra ? _prdBadgeTendencia(r.media_kg_semana, ra.media_kg_semana) : ''}</div>
    <div class="stat-card"><div class="stat-icon-circle" style="background:#dcfce7;">🌾</div><div class="stat-value stat-verde">${r.media_g_un ? r.media_g_un + ' g' : '--'}</div><div class="stat-label">Média g/Unidade</div>${ra ? _prdBadgeTendencia(r.media_g_un, ra.media_g_un) : ''}</div>
    <div class="stat-card"><div class="stat-icon-circle" style="background:#dbeafe;">🚚</div><div class="stat-value stat-azul">${fmtNum(r.total_parceiro_dias)}</div><div class="stat-label">Dias c/ Entrega</div><div class="text-muted" style="margin-top:2px;">${pctDiasParceiro !== null ? pctDiasParceiro + '% do período' : '--'}</div></div>
    <div class="stat-card"><div class="stat-icon-circle" style="background:#ede9fe;">👥</div><div class="stat-value" style="color:#6d28d9;">${r.total_parceiros}</div><div class="stat-label">Parceiros</div><div class="text-muted" style="margin-top:2px;">Ativos no período</div></div>
  `;

  // ── gráfico: KG por dia (últimos 90 dias) ──────────────────
  if (Gerente.cPRDDia) Gerente.cPRDDia.destroy();
  const cd = document.getElementById('cPRDDia');
  if (cd) {
    const dias = d.porDia.slice(-90);
    const lbl  = document.getElementById('prdDiaLabel');
    if (lbl) lbl.textContent = dias.length < d.porDia.length ? `(últimos ${dias.length} dias)` : `(${dias.length} dias)`;
    // média móvel 7 dias
    const media7 = dias.map((_, i) => {
      const slice = dias.slice(Math.max(0, i - 6), i + 1);
      return +(slice.reduce((s, x) => s + x.peso_kg, 0) / slice.length).toFixed(1);
    });
    Gerente.cPRDDia = new Chart(cd, {
      type: 'line',
      data: {
        labels: dias.map(x => fmtDate(x.data)),
        datasets: [
          {
            label: 'KG/dia',
            data: dias.map(x => x.peso_kg),
            borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,.08)',
            borderWidth: 1.5, pointRadius: 1.5, fill: true, tension: 0.2, order: 2
          },
          {
            label: 'Média 7d',
            data: media7,
            borderColor: '#f59e0b', backgroundColor: 'transparent',
            borderWidth: 2, pointRadius: 0, fill: false, tension: 0.4, borderDash: [4, 3], order: 1
          }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: { legend: { position: 'bottom', labels: { font: { size: 10 }, padding: 10 } } },
        scales: {
          x: { ticks: { font: { size: 9 }, color: '#94a3b8', maxTicksLimit: 12 }, grid: { display: false } },
          y: { ticks: { font: { size: 10 }, color: '#94a3b8' }, grid: { color: '#f1f5f9' } }
        }
      }
    });
  }

  // ── gráfico: KG por semana + projeção ─────────────────────
  if (Gerente.cPRDSem) Gerente.cPRDSem.destroy();
  const cs = document.getElementById('cPRDSem');
  if (cs) {
    // usa dados combinados (proj) se disponível, senão apenas histórico
    const semData = proj && proj.length
      ? proj.slice(-40)
      : d.porSemana.slice(-24).map(s => ({ label: s.label, historico: s.peso_kg, projecao: 0 }));

    // linha de média histórica
    const histVals  = semData.map(x => x.historico || 0).filter(v => v > 0);
    const mediaHist = histVals.length ? +(histVals.reduce((s, v) => s + v, 0) / histVals.length).toFixed(1) : 0;

    Gerente.cPRDSem = new Chart(cs, {
      type: 'bar',
      data: {
        labels: semData.map(x => x.label),
        datasets: [
          {
            label: 'KG Entregue',
            data: semData.map(x => x.historico || 0),
            backgroundColor: '#16a34a', borderRadius: 3, order: 2
          },
          {
            label: 'KG Projetado (Transplantios)',
            data: semData.map(x => x.projecao || 0),
            backgroundColor: 'rgba(234,179,8,.65)', borderRadius: 3, order: 3
          },
          {
            label: `Média histórica (${fmtKg(mediaHist)}/sem)`,
            data: semData.map(() => mediaHist),
            type: 'line', borderColor: '#dc2626', borderWidth: 2,
            pointRadius: 0, fill: false, borderDash: [5, 4], order: 1
          }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: { legend: { position: 'bottom', labels: { font: { size: 10 }, padding: 10 } } },
        scales: {
          x: { ticks: { font: { size: 9 }, color: '#94a3b8', maxRotation: 45 }, grid: { display: false } },
          y: { ticks: { font: { size: 10 }, color: '#94a3b8' }, grid: { color: '#f1f5f9' } }
        }
      }
    });
  }

  // ── resumo do período ────────────────────────────────────────
  document.getElementById('prdResumoPeriodo').innerHTML = `
    <div style="display:flex;flex-direction:column;gap:10px;font-size:12px;">
      <div style="display:flex;justify-content:space-between;gap:8px;"><span>🔒 Total KG:</span><strong>${fmtKg(r.total_kg)}</strong></div>
      <div style="display:flex;justify-content:space-between;gap:8px;"><span>📦 Total Unidades:</span><strong>${fmtNum(r.total_unidades)}</strong></div>
      <div style="display:flex;justify-content:space-between;gap:8px;"><span>📈 Média KG/Dia:</span><strong>${fmtKg(r.media_kg_dia)}</strong></div>
      <div style="display:flex;justify-content:space-between;gap:8px;"><span>📅 Média KG/Semana:</span><strong>${fmtKg(r.media_kg_semana)}</strong></div>
      <div style="display:flex;justify-content:space-between;gap:8px;"><span>🌾 Média g/Unidade:</span><strong>${r.media_g_un ? r.media_g_un + ' g' : '--'}</strong></div>
      <div style="display:flex;justify-content:space-between;gap:8px;"><span>🚚 Dias com Entrega:</span><strong>${fmtNum(r.total_parceiro_dias)}</strong></div>
      <div style="display:flex;justify-content:space-between;gap:8px;"><span>👥 Parceiros Ativos:</span><strong>${r.total_parceiros}</strong></div>
    </div>
  `;

  const _rotOcultoPrd = localStorage.getItem('spg_prd_rotulos_ocultos') === '1';

  // ── distribuição do total kg (donut top parceiros + outros) ──
  const CORES_PRD_DIST = ['#0d5c3a', '#16a34a', '#22c55e', '#4ade80', '#86efac', '#94a3b8'];
  const distTop = d.porParceiro.slice(0, 5);
  const distOutrosKg = d.porParceiro.slice(5).reduce((s, p) => s + p.peso_kg, 0);
  const distEntradas = distTop.map(p => [p.parceiro, p.peso_kg]);
  if (distOutrosKg > 0) distEntradas.push(['Outros', +distOutrosKg.toFixed(1)]);

  if (Gerente.cPRDDist) Gerente.cPRDDist.destroy();
  const elDist = document.getElementById('cPRDDist');
  const legDist = document.getElementById('prdDistLegenda');
  const totDist = document.getElementById('prdDistTotalTxt');
  if (totDist) totDist.innerHTML = distEntradas.length ? `${fmtKg(r.total_kg)}` : '';
  if (elDist && distEntradas.length) {
    Gerente.cPRDDist = new Chart(elDist, {
      type: 'doughnut',
      data: { labels: distEntradas.map(e => e[0]), datasets: [{ data: distEntradas.map(e => e[1]), backgroundColor: distEntradas.map((_, i) => CORES_PRD_DIST[i % CORES_PRD_DIST.length]), borderWidth:2, borderColor:'#fff' }] },
      options: { responsive:true, maintainAspectRatio:false, cutout:'62%', plugins:{ legend:{ display:false },
        datalabels:{ display:!_rotOcultoPrd, color:'#fff', font:{ size:9, weight:'700' }, formatter:v => r.total_kg > 0 ? Math.round(v / r.total_kg * 100) + '%' : '' } } }
    });
    if (legDist) legDist.innerHTML = distEntradas.map((e, i) => `
      <div style="display:flex;align-items:center;gap:6px;margin-top:4px;">
        <span style="width:10px;height:10px;border-radius:50%;background:${CORES_PRD_DIST[i % CORES_PRD_DIST.length]};display:inline-block;flex-shrink:0;"></span>
        <span style="font-weight:700;">${e[0]}</span>
        <span style="color:#94a3b8;margin-left:auto;">${r.total_kg > 0 ? Math.round(e[1] / r.total_kg * 100) : 0}%</span>
      </div>`).join('');
  } else if (legDist) {
    legDist.innerHTML = '<p class="text-muted text-center">Sem dados no período/filtro selecionado.</p>';
  }

  // ── média kg por unidade (gauge) ───────────────────────────────
  const ESCALA_MEDIA_G = 600;
  const pctGauge = r.media_g_un ? Math.min(100, Math.round(r.media_g_un / ESCALA_MEDIA_G * 100)) : 0;
  if (Gerente.cPRDMediaGauge) Gerente.cPRDMediaGauge.destroy();
  const elMG = document.getElementById('cPRDMediaGauge');
  if (elMG) Gerente.cPRDMediaGauge = new Chart(elMG, {
    type: 'doughnut',
    data: { labels:['Média','Restante'], datasets:[{ data:[pctGauge, Math.max(0, 100 - pctGauge)], backgroundColor:['#16a34a','#e2e8f0'], borderWidth:0 }] },
    options: { responsive:true, maintainAspectRatio:false, circumference:180, rotation:-90, cutout:'75%', plugins:{ legend:{ display:false }, tooltip:{ enabled:false } } }
  });
  const txtMG = document.getElementById('prdMediaGaugeTxt');
  if (txtMG) txtMG.innerHTML = `<div style="font-size:24px;font-weight:900;color:#16a34a;">${r.media_g_un ? r.media_g_un + ' g' : '--'}</div><div style="font-size:10px;color:#94a3b8;">0 g — ${ESCALA_MEDIA_G} g</div>`;

  // ── evolução da média (g/unidade) por mês ──────────────────────
  const MESES_ABREV = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const mesesEvo = (d.porMes || []).filter(m => m.media_g_un !== null).slice(-6);
  if (Gerente.cPRDEvoMedia) Gerente.cPRDEvoMedia.destroy();
  const elEvo = document.getElementById('cPRDEvoMedia');
  if (elEvo && mesesEvo.length) {
    Gerente.cPRDEvoMedia = new Chart(elEvo, {
      type: 'line',
      data: { labels: mesesEvo.map(m => `${MESES_ABREV[m.mes - 1] || m.mes}/${String(m.ano).slice(-2)}`), datasets:[{ label:'g/unidade', data: mesesEvo.map(m => m.media_g_un), borderColor:'#0d5c3a', backgroundColor:'rgba(13,92,58,.12)', borderWidth:2, fill:true, tension:.3, pointRadius:4 }] },
      options: { responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false },
          datalabels:{ display:!_rotOcultoPrd, align:'top', color:'#475569', font:{ size:10, weight:'700' }, formatter:v => v + ' g' } },
        layout:{ padding:{ top:18 } },
        scales:{ x:{ ticks:{ font:{size:10}, color:'#94a3b8' }, grid:{ display:false } }, y:{ ticks:{ font:{size:9}, color:'#94a3b8', callback:v=>v+' g' }, grid:{ color:'#f1f5f9' } } } }
    });
  }

  // ── tabela por parceiro (top 5 + outros, com opção de ver todos) ──
  const card = document.getElementById('prdPaCard');
  const tb   = document.getElementById('prdTPa');
  if (card && tb && d.porParceiro.length > 1) {
    card.style.display = '';
    const LIMITE = 5;
    const todos = Gerente._prdParceirosTodos;
    const exibidos = todos ? d.porParceiro : d.porParceiro.slice(0, LIMITE);
    const linha = p => {
      const pct = r.total_kg > 0 ? Math.round(p.peso_kg / r.total_kg * 100) : 0;
      return `<tr><td><strong>${p.parceiro}</strong></td><td>${fmtKg(p.peso_kg)}</td>
        <td><div style="display:flex;align-items:center;gap:6px;"><div class="progress" style="width:70px;"><div class="progress-bar" style="width:${Math.min(pct,100)}%;background:#16a34a;"></div></div><span>${pct}%</span></div></td>
        <td>${fmtNum(p.unidades)}</td><td>${p.media_g_un ? p.media_g_un + ' g' : '--'}</td>
        <td>${fmtKg(p.media_kg_dia)}</td><td>${fmtNum(p.dias_com_entrega)}</td><td>${p.ultima_entrega ? fmtDate(p.ultima_entrega) : '--'}</td></tr>`;
    };
    let html = exibidos.map(linha).join('');
    if (!todos && d.porParceiro.length > LIMITE) {
      const resto = d.porParceiro.slice(LIMITE);
      const kgResto  = resto.reduce((s, p) => s + p.peso_kg, 0);
      const unResto  = resto.reduce((s, p) => s + p.unidades, 0);
      const diasResto = resto.reduce((s, p) => s + p.dias_com_entrega, 0);
      const mediaResto = unResto > 0 ? Math.round(kgResto * 1000 / unResto) : null;
      const pctResto = r.total_kg > 0 ? Math.round(kgResto / r.total_kg * 100) : 0;
      const ultimaResto = resto.reduce((max, p) => (p.ultima_entrega && (!max || p.ultima_entrega > max)) ? p.ultima_entrega : max, null);
      html += `<tr style="font-weight:700;color:#64748b;"><td>Outros (${resto.length} parceiros)</td><td>${fmtKg(kgResto)}</td>
        <td><div style="display:flex;align-items:center;gap:6px;"><div class="progress" style="width:70px;"><div class="progress-bar" style="width:${Math.min(pctResto,100)}%;background:#94a3b8;"></div></div><span>${pctResto}%</span></div></td>
        <td>${fmtNum(unResto)}</td><td>${mediaResto ? mediaResto + ' g' : '--'}</td>
        <td>${diasResto > 0 ? fmtKg(kgResto / diasResto) : '--'}</td><td>${fmtNum(diasResto)}</td><td>${ultimaResto ? fmtDate(ultimaResto) : '--'}</td></tr>`;
    }
    tb.innerHTML = html;

    const toggleWrap = document.getElementById('prdParceirosToggleWrap');
    const toggleBtn  = document.getElementById('prdParceirosToggle');
    if (toggleWrap && toggleBtn) {
      toggleWrap.style.display = d.porParceiro.length > LIMITE ? '' : 'none';
      toggleBtn.textContent = todos ? '‹ Ver menos' : 'Ver todos os parceiros ›';
    }
  } else if (card) {
    card.style.display = 'none';
  }
  _sincronizarBotaoRotulosPrd();
}

function gTogglePrdParceiros() {
  Gerente._prdParceirosTodos = !Gerente._prdParceirosTodos;
  if (Gerente._prdUltimo) gDashPRD(Gerente._prdUltimo.d, Gerente._prdUltimo.proj, Gerente._prdUltimo.dAnterior, Gerente._prdUltimo.dListaParceiros);
}

function gPrdLimparFiltro() {
  document.getElementById('prdFAno').value = '';
  document.getElementById('prdFMes').value = '';
  document.getElementById('prdFPa').value = '';
  document.getElementById('prdFCl').value = '';
  gLoadPRD();
}

function gToggleRotulosPrd() {
  const oculto = localStorage.getItem('spg_prd_rotulos_ocultos') !== '1';
  localStorage.setItem('spg_prd_rotulos_ocultos', oculto ? '1' : '0');
  _sincronizarBotaoRotulosPrd();
  ['cPRDDist', 'cPRDEvoMedia'].forEach(id => {
    const chart = Gerente[id];
    if (!chart || !chart.options.plugins.datalabels) return;
    chart.options.plugins.datalabels.display = !oculto;
    chart.update();
  });
}

function _sincronizarBotaoRotulosPrd() {
  const btn = document.getElementById('prdBtnRotulos');
  if (!btn) return;
  const oculto = localStorage.getItem('spg_prd_rotulos_ocultos') === '1';
  btn.textContent = oculto ? 'Mostrar Rótulos' : 'Ocultar Rótulos';
}

// ════════════════════════════════════════════════════════════════════════
// Aba Produtividade — entregas por dia/semana (PRD): unidades, kg e média
// do tamanho da cabeça (g/unidade). Mesma fonte de dados do PRD Consolidado.
// ════════════════════════════════════════════════════════════════════════

function gLoadProdutividade() {
  const ano      = (document.getElementById('prodFAno') || {}).value || '';
  const mes      = (document.getElementById('prodFMes') || {}).value || '';
  const parceiro = (document.getElementById('prodFPa')  || {}).value || '';
  const classe   = (document.getElementById('prodFCl')  || {}).value || '';

  const stats = document.getElementById('prodStats');
  if (stats) stats.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:16px;color:#94a3b8;font-size:12px;">Carregando dados...</div>';

  Promise.all([
    gsPRD('getEntregasDashboard', App.token, { ano, mes, parceiro, classe }),
    // mesmo motivo do gLoadPRD: com parceiro já selecionado, "d" vem restrito a ele, então busca
    // à parte (sem parceiro) só pra montar a lista completa de parceiros daquela classe/período.
    parceiro ? gsPRD('getEntregasDashboard', App.token, { ano, mes, parceiro: '', classe }).catch(() => null) : Promise.resolve(null)
  ])
    .then(([d, dListaParceiros]) => gDashProdutividade(d, dListaParceiros))
    .catch(e => {
      if (stats) stats.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:16px;color:#dc2626;font-size:12px;">Erro: ${e.message}</div>`;
    });
}

function gDashProdutividade(d, dListaParceiros) {
  _prdMesclarSitioLeitao(d);
  if (dListaParceiros) _prdMesclarSitioLeitao(dListaParceiros);
  Gerente._prodUltimo = { d, dListaParceiros };

  const listaParceirosClasse = ((dListaParceiros || d).porParceiro || []).map(p => p.parceiro).sort((a, b) => a.localeCompare(b, 'pt-BR'));

  ['prodFAno','prodFMes','prodFPa','prodFCl'].forEach((id, i) => {
    const el = document.getElementById(id); if (!el) return;
    const curr = el.value;
    const lista = id === 'prodFPa' ? listaParceirosClasse : ([d.anos, d.meses, d.parceiros, d.classes][i] || []);
    el.innerHTML = `<option value="">${['Todos','Todos','Todos','Todas'][i]}</option>`;
    lista.forEach(v => {
      const o = document.createElement('option');
      o.value = v; o.textContent = id === 'prodFMes' ? (MESES_PT[v - 1] || v) : v;
      el.appendChild(o);
    });
    if (curr) el.value = curr;
  });

  // ── na primeira carga, filtra por padrão pela classe "Brócolis" ──
  if (!Gerente._prodClasseInicializada) {
    Gerente._prodClasseInicializada = true;
    const selCl = document.getElementById('prodFCl');
    if (selCl && !selCl.value) {
      const match = (d.classes || []).find(c => _prdNormalizar(c).includes('brocolis'));
      if (match) { selCl.value = match; gLoadProdutividade(); return; }
    }
  }

  const r = d.resumo;
  const stats = document.getElementById('prodStats');
  if (stats) stats.innerHTML = `
    <div class="stat-card"><div class="stat-icon-circle" style="background:#dbeafe;">📦</div><div class="stat-value stat-azul">${fmtNum(r.total_unidades)}</div><div class="stat-label">Total Unidades</div></div>
    <div class="stat-card"><div class="stat-icon-circle" style="background:#dcfce7;">🚚</div><div class="stat-value stat-verde">${fmtKg(r.total_kg)}</div><div class="stat-label">Total KG</div></div>
    <div class="stat-card"><div class="stat-icon-circle" style="background:#fef3c7;">🥦</div><div class="stat-value stat-ambar">${r.media_g_un ? r.media_g_un + ' g' : '--'}</div><div class="stat-label">Média do Tamanho (g/unid.)</div></div>
    <div class="stat-card"><div class="stat-icon-circle" style="background:#ede9fe;">👥</div><div class="stat-value" style="color:#6d28d9;">${r.total_parceiros}</div><div class="stat-label">Parceiros Ativos</div></div>
  `;

  _prodRenderCharts(d);
}

function _prodRenderCharts(d) {
  const modo = Gerente._prodModo;
  const _rotOcultoProd = localStorage.getItem('spg_prod_rotulos_ocultos') === '1';

  const todasBuckets = (modo === 'dia' ? d.porDia : d.porSemana) || [];
  const LIMITE = modo === 'dia' ? 90 : 52;
  const bucket = todasBuckets.slice(-LIMITE);
  const sufixo = bucket.length < todasBuckets.length
    ? (modo === 'dia' ? `(últimos ${bucket.length} dias)` : `(últimas ${bucket.length} semanas)`)
    : (modo === 'dia' ? `(${bucket.length} dias)` : `(${bucket.length} semanas)`);
  ['prodUnidLabel', 'prodKgLabel', 'prodMediaLabel'].forEach(id => { const el = document.getElementById(id); if (el) el.textContent = sufixo; });

  const labels   = bucket.map(b => modo === 'dia' ? fmtDate(b.data) : b.label);
  const unidades = bucket.map(b => b.unidades);
  const kg       = bucket.map(b => +b.peso_kg.toFixed(1));
  const media    = bucket.map(b => b.unidades > 0 ? Math.round(b.peso_kg * 1000 / b.unidades) : null);

  if (Gerente.cProdUnid) Gerente.cProdUnid.destroy();
  const elU = document.getElementById('cProdUnid');
  if (elU) Gerente.cProdUnid = new Chart(elU, {
    type: 'bar',
    data: { labels, datasets: [{ label:'Unidades', data: unidades, backgroundColor:'#2563eb', borderRadius:4, borderSkipped:false }] },
    options: { responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false },
        datalabels:{ display:!_rotOcultoProd, anchor:'end', align:'top', color:'#475569', font:{ size:9, weight:'700' }, formatter:v => fmtNum(v) } },
      layout:{ padding:{ top:18 } },
      scales:{ x:{ ticks:{ font:{size:9}, color:'#94a3b8', maxRotation:0, autoSkip:true }, grid:{ display:false } }, y:{ ticks:{ font:{size:10}, color:'#94a3b8' }, grid:{ color:'#f1f5f9' } } } }
  });

  if (Gerente.cProdKg) Gerente.cProdKg.destroy();
  const elK = document.getElementById('cProdKg');
  if (elK) Gerente.cProdKg = new Chart(elK, {
    type: 'bar',
    data: { labels, datasets: [{ label:'KG', data: kg, backgroundColor:'#16a34a', borderRadius:4, borderSkipped:false }] },
    options: { responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false },
        datalabels:{ display:!_rotOcultoProd, anchor:'end', align:'top', color:'#475569', font:{ size:9, weight:'700' }, formatter:v => fmtNum(v) } },
      layout:{ padding:{ top:18 } },
      scales:{ x:{ ticks:{ font:{size:9}, color:'#94a3b8', maxRotation:0, autoSkip:true }, grid:{ display:false } }, y:{ ticks:{ font:{size:10}, color:'#94a3b8' }, grid:{ color:'#f1f5f9' } } } }
  });

  if (Gerente.cProdMedia) Gerente.cProdMedia.destroy();
  const elM = document.getElementById('cProdMedia');
  if (elM) Gerente.cProdMedia = new Chart(elM, {
    type: 'line',
    data: { labels, datasets: [{ label:'g/unidade', data: media, borderColor:'#7c3aed', backgroundColor:'rgba(124,58,237,.12)', borderWidth:2, fill:true, tension:.3, pointRadius:3, spanGaps:true }] },
    options: { responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false },
        datalabels:{ display:!_rotOcultoProd, align:'top', color:'#475569', font:{ size:9, weight:'700' }, formatter:v => v !== null ? v + ' g' : '' } },
      layout:{ padding:{ top:18 } },
      scales:{ x:{ ticks:{ font:{size:9}, color:'#94a3b8', maxRotation:0, autoSkip:true }, grid:{ display:false } }, y:{ ticks:{ font:{size:9}, color:'#94a3b8', callback:v=>v+' g' }, grid:{ color:'#f1f5f9' } } } }
  });

  _sincronizarBotaoRotulosProd();
  _sincronizarBotaoModoProd();
}

function gProdModo(modo) {
  Gerente._prodModo = modo;
  if (Gerente._prodUltimo) _prodRenderCharts(Gerente._prodUltimo.d);
  else _sincronizarBotaoModoProd();
}

function _sincronizarBotaoModoProd() {
  const btnDia = document.getElementById('prodBtnDia');
  const btnSemana = document.getElementById('prodBtnSemana');
  if (!btnDia || !btnSemana) return;
  const ativoDia = Gerente._prodModo === 'dia';
  btnDia.style.background = ativoDia ? '#0d5c3a' : '#f1f5f9';
  btnDia.style.color = ativoDia ? '#fff' : '#334155';
  btnSemana.style.background = !ativoDia ? '#0d5c3a' : '#f1f5f9';
  btnSemana.style.color = !ativoDia ? '#fff' : '#334155';
}

function gProdLimparFiltro() {
  document.getElementById('prodFAno').value = '';
  document.getElementById('prodFMes').value = '';
  document.getElementById('prodFPa').value = '';
  document.getElementById('prodFCl').value = '';
  gLoadProdutividade();
}

function gToggleRotulosProd() {
  const oculto = localStorage.getItem('spg_prod_rotulos_ocultos') !== '1';
  localStorage.setItem('spg_prod_rotulos_ocultos', oculto ? '1' : '0');
  _sincronizarBotaoRotulosProd();
  ['cProdUnid', 'cProdKg', 'cProdMedia'].forEach(id => {
    const chart = Gerente[id];
    if (!chart || !chart.options.plugins.datalabels) return;
    chart.options.plugins.datalabels.display = !oculto;
    chart.update();
  });
}

function _sincronizarBotaoRotulosProd() {
  const btn = document.getElementById('prodBtnRotulos');
  if (!btn) return;
  const oculto = localStorage.getItem('spg_prod_rotulos_ocultos') === '1';
  btn.textContent = oculto ? 'Mostrar Rótulos' : 'Ocultar Rótulos';
}

// ════════════════════════════════════════════════════════════════════════
// Relatório de impressão (A4, sem gráficos) — monta um HTML formal com
// cabeçalho/parâmetros/resumo/tabela e chama window.print(); o CSS de
// @media print esconde o resto da página e mostra só o #printArea.
// ════════════════════════════════════════════════════════════════════════

function _relDataEmissao() {
  const d = new Date();
  return d.toLocaleDateString('pt-BR') + ' às ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}

function _relTextoSelecionado(sel) {
  return (sel && sel.value) ? sel.options[sel.selectedIndex].text : (sel ? 'Todos' : '--');
}

function _relCabecalho(titulo, subtitulo) {
  return `
    <table class="rel-header-tbl">
      <tr>
        <td class="rel-logo-cel"><img src="${BRAND_LOGO_URL}"></td>
        <td class="rel-titulo"><div class="t1">${titulo}</div><div class="t2">${subtitulo}</div></td>
        <td class="rel-emissao"><div class="lbl">DATA DE EMISSÃO</div><div class="val">${_relDataEmissao()}</div></td>
      </tr>
    </table>
    <table><tr><td class="rel-sistema">Sistema de Planejamento e Gestão · SPG Transplantio — Controle de Parceiros</td></tr></table>
  `;
}

function _relSecao(numero, titulo) {
  return `<table><tr><td class="rel-sec-bar">${numero}. ${titulo}</td></tr></table>`;
}

// pares: [ [label, valor], ... ] — renderiza 2 pares por linha (label/valor/label/valor)
function _relParametros(pares) {
  let linhas = '';
  for (let i = 0; i < pares.length; i += 2) {
    const [l1, v1] = pares[i];
    const par2 = pares[i + 1];
    linhas += `<tr><td class="lbl-cel">${l1}:</td><td>${v1 || '--'}</td>${par2 ? `<td class="lbl-cel">${par2[0]}:</td><td>${par2[1] || '--'}</td>` : '<td></td><td></td>'}</tr>`;
  }
  return `<table>${linhas}</table>`;
}

// pares: [ [label, valor], ... ] — renderiza todos numa única linha de KPIs
function _relResumo(pares) {
  const th = pares.map(p => `<th>${p[0]}</th>`).join('');
  const td = pares.map(p => `<td class="num">${p[1]}</td>`).join('');
  return `<table><tr>${th}</tr><tr>${td}</tr></table>`;
}

// headers: string[]; linhas: string[][] (células já formatadas, aceita html simples como <strong>)
function _relTabela(headers, linhas) {
  const th = headers.map(h => `<th>${h}</th>`).join('');
  const tr = linhas.length
    ? linhas.map(cols => `<tr>${cols.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')
    : `<tr><td colspan="${headers.length}" style="text-align:center;color:#94a3b8;">Nenhum registro no filtro selecionado.</td></tr>`;
  return `<table><tr>${th}</tr>${tr}</table>`;
}

function _relRodape() {
  return `<div class="rel-rodape">
    <p>* Relatório gerado automaticamente pelo Sistema de Planejamento e Gestão (SPG) — Transplantio Parceiros.</p>
    <p>* Os resultados apresentados baseiam-se nas consolidações e nos filtros acima informados no momento da geração. Uso interno.</p>
  </div>`;
}

function _relExibir(corpoHtml) {
  document.getElementById('printArea').innerHTML = `<div class="rel-print">${corpoHtml}</div>`;
  window.print();
}

function gImprimirDashboard() {
  const d = Gerente.dados;
  if (!d) { toast('Aguarde o carregamento do dashboard.', 'error'); return; }
  const r = d.resumo;

  const html = _relCabecalho('RELATÓRIO DE GESTÃO E PRODUTIVIDADE', 'Painel de Transplantios e Colheitas') +
    _relSecao(1, 'Parâmetros da Análise (Filtros Globais)') +
    _relParametros([
      ['Período', _relTextoSelecionado(document.getElementById('gFP'))],
      ['Parceiro', _relTextoSelecionado(document.getElementById('gFPa'))],
      ['Cultura', _relTextoSelecionado(document.getElementById('gFCu'))]
    ]) +
    _relSecao(2, 'Resumo do Período') +
    _relResumo([
      ['Transplantios', fmtNum(r.total_transplantios)],
      ['Mudas Previstas', fmtNum(r.unidades_previstas)],
      ['Mudas Entregues', fmtNum(r.unidades_entregues)],
      ['% Mudas', r.pct_unidades + '%'],
      ['KG Previsto', fmtKg(r.kg_previsto)],
      ['KG Entregue', fmtKg(r.kg_entregue)],
      ['% KG', r.pct_kg + '%'],
      ['Próximas Colheitas', fmtNum(r.colheitas_proximas)]
    ]) +
    _relSecao(3, 'Detalhamento por Parceiro') +
    _relTabela(
      ['Parceiro', 'Transplantios', 'Mudas Entregues', 'Mudas Previstas', 'KG Entregue', 'KG Previsto', '% Entrega'],
      (d.painelParceiros || []).map(p => [
        `<strong>${p.nome_fazenda}</strong>`, fmtNum(p.total_transplantios), fmtNum(p.unidades_entregues), fmtNum(p.unidades_previstas),
        fmtKg(p.kg_entregue), fmtKg(p.kg_previsto), p.pct_entregue !== null ? p.pct_entregue + '%' : '--'
      ])
    ) +
    _relRodape();

  _relExibir(html);
}

function gImprimirParceiros() {
  const painel = (Gerente.dados && Gerente.dados.painelParceiros) || [];
  if (!painel.length) { toast('Nenhum dado de parceiros carregado ainda.', 'error'); return; }

  const totalKgEntregue    = painel.reduce((s, p) => s + p.kg_entregue, 0);
  const totalKgPrevisto    = painel.reduce((s, p) => s + p.kg_previsto, 0);
  const totalUnEntregues   = painel.reduce((s, p) => s + p.unidades_entregues, 0);
  const totalUnPrevistas   = painel.reduce((s, p) => s + p.unidades_previstas, 0);
  const totalTransplantios = painel.reduce((s, p) => s + p.total_transplantios, 0);
  const mediaGeralGr       = totalUnEntregues > 0 ? Math.round(totalKgEntregue * 1000 / totalUnEntregues) : null;
  const taxaEntregaGeral   = totalKgPrevisto > 0 ? Math.round(totalKgEntregue / totalKgPrevisto * 100) : 0;
  const rankKg             = painel.slice().sort((a, b) => b.kg_entregue - a.kg_entregue);

  const html = _relCabecalho('RELATÓRIO DE GESTÃO E PRODUTIVIDADE', 'Painel de Parceiros') +
    _relSecao(1, 'Parâmetros da Análise (Filtros Globais)') +
    _relParametros([
      ['Período', _relTextoSelecionado(document.getElementById('gFP'))],
      ['Parceiro', _relTextoSelecionado(document.getElementById('gFPa'))],
      ['Cultura', _relTextoSelecionado(document.getElementById('gFCu'))]
    ]) +
    _relSecao(2, 'Resumo Geral') +
    _relResumo([
      ['KG Entregue', fmtKg(totalKgEntregue)],
      ['KG Previsto', fmtKg(totalKgPrevisto)],
      ['Taxa de Entrega', taxaEntregaGeral + '%'],
      ['Mudas Entregues', fmtNum(totalUnEntregues)],
      ['Mudas Previstas', fmtNum(totalUnPrevistas)],
      ['Transplantios', fmtNum(totalTransplantios)],
      ['Média g/Unidade', mediaGeralGr !== null ? mediaGeralGr + ' g' : '--'],
      ['Parceiros Ativos', painel.length]
    ]) +
    _relSecao(3, 'Ranking de Produção por Parceiro') +
    _relTabela(
      ['Parceiro', 'KG Entregue', 'KG Previsto', '% Entrega', 'Mudas Entregues', 'Mudas Previstas', 'Transplantios', 'Média g/Unid.'],
      rankKg.map(p => [
        `<strong>${p.nome_fazenda}</strong>`, fmtKg(p.kg_entregue), fmtKg(p.kg_previsto),
        p.pct_kg !== null ? p.pct_kg + '%' : '--', fmtNum(p.unidades_entregues), fmtNum(p.unidades_previstas),
        fmtNum(p.total_transplantios), p.media_gr_por_unidade ? p.media_gr_por_unidade + ' g' : '--'
      ])
    ) +
    _relRodape();

  _relExibir(html);
}

function gImprimirTransplantios() {
  const de       = (document.getElementById('trFDe') || {}).value || '';
  const ate      = (document.getElementById('trFAte') || {}).value || '';
  const parceiro = (document.getElementById('trFPa')  || {}).value || '';

  const filtrado = (Gerente._trTodos || []).filter(t => {
    if (de && t.data_transplantio < de) return false;
    if (ate && t.data_transplantio > ate) return false;
    if (parceiro && t.nome_parceiro !== parceiro) return false;
    return true;
  });

  const totalMudas       = filtrado.reduce((s, t) => s + Number(t.quantidade_unidades || 0), 0);
  const totalKg          = filtrado.reduce((s, t) => s + Number(t.kg_previsto || 0), 0);
  const parceirosUnicos  = new Set(filtrado.map(t => t.nome_parceiro));
  const variedadesUnicas = new Set(filtrado.filter(t => t.nome_variedade).map(t => t.nome_variedade));
  const hojeISO          = new Date().toISOString().slice(0, 10);
  const proximaColheita  = filtrado.map(t => t.data_prevista_colheita).filter(dt => dt && dt >= hojeISO).sort()[0];

  const html = _relCabecalho('RELATÓRIO DE GESTÃO E PRODUTIVIDADE', 'Painel de Plantios') +
    _relSecao(1, 'Parâmetros da Análise (Filtros Globais)') +
    _relParametros([
      ['De (plantio)', de ? fmtDate(de) : 'Todo o histórico'],
      ['Até (plantio)', ate ? fmtDate(ate) : 'Todo o histórico'],
      ['Parceiro', parceiro || 'Todos']
    ]) +
    _relSecao(2, 'Resumo do Período') +
    _relResumo([
      ['Total de Mudas', fmtNum(totalMudas)],
      ['Produção Prevista', fmtKg(totalKg)],
      ['Parceiros', parceirosUnicos.size],
      ['Variedades', variedadesUnicas.size],
      ['Próxima Colheita', proximaColheita ? fmtDate(proximaColheita) : '--']
    ]) +
    _relSecao(3, 'Detalhamento de Plantios') +
    _relTabela(
      ['Data Plantio', 'Parceiro', 'Cultura', 'Variedade', 'Mudas', 'KG Previsto', 'Colheita Prevista', 'Lote'],
      filtrado.slice().sort((a, b) => b.data_transplantio.localeCompare(a.data_transplantio)).map(t => [
        fmtDate(t.data_transplantio), `<strong>${t.nome_parceiro}</strong>`, t.nome_cultura, t.nome_variedade || '--',
        fmtNum(t.quantidade_unidades), fmtKg(t.kg_previsto), fmtDate(t.data_prevista_colheita), t.lote || '--'
      ])
    ) +
    _relRodape();

  _relExibir(html);
}

function gImprimirRelatorios() {
  const ult = Gerente._prdUltimo;
  if (!ult) { toast('Aguarde o carregamento dos relatórios.', 'error'); return; }
  const d = ult.d;
  const r = d.resumo;

  const html = _relCabecalho('RELATÓRIO DE GESTÃO E PRODUTIVIDADE', 'Histórico de Entregas — PRD Consolidado') +
    _relSecao(1, 'Parâmetros da Análise (Filtros Globais)') +
    _relParametros([
      ['Ano', _relTextoSelecionado(document.getElementById('prdFAno'))],
      ['Mês', _relTextoSelecionado(document.getElementById('prdFMes'))],
      ['Parceiro', _relTextoSelecionado(document.getElementById('prdFPa'))],
      ['Classe', _relTextoSelecionado(document.getElementById('prdFCl'))]
    ]) +
    _relSecao(2, 'Resumo do Período') +
    _relResumo([
      ['Total KG', fmtKg(r.total_kg)],
      ['Total Unidades', fmtNum(r.total_unidades)],
      ['Média KG/Dia', fmtKg(r.media_kg_dia)],
      ['Média KG/Semana', fmtKg(r.media_kg_semana)],
      ['Média g/Unidade', r.media_g_un ? r.media_g_un + ' g' : '--'],
      ['Dias c/ Entrega', fmtNum(r.total_parceiro_dias)],
      ['Parceiros Ativos', r.total_parceiros]
    ]) +
    _relSecao(3, 'Entregas por Parceiro') +
    _relTabela(
      ['Parceiro', 'KG Total', '% Participação', 'Unidades', 'Média g/Unid.', 'Média KG/Dia', 'Dias c/ Entrega', 'Última Entrega'],
      (d.porParceiro || []).map(p => {
        const pct = r.total_kg > 0 ? Math.round(p.peso_kg / r.total_kg * 100) : 0;
        return [
          `<strong>${p.parceiro}</strong>`, fmtKg(p.peso_kg), pct + '%', fmtNum(p.unidades),
          p.media_g_un ? p.media_g_un + ' g' : '--', fmtKg(p.media_kg_dia), fmtNum(p.dias_com_entrega),
          p.ultima_entrega ? fmtDate(p.ultima_entrega) : '--'
        ];
      })
    ) +
    _relRodape();

  _relExibir(html);
}
</script>
