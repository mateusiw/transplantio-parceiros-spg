// ── ASSISTENTE IA ─────────────────────────────────────────────
// A chave da API da Groq fica só no localStorage deste navegador — nunca é enviada
// ao Apps Script nem salva no código. O Apps Script só devolve o resumo dos dados
// (obterContextoIA); quem chama a Groq de fato é o próprio navegador (fetch direto).
const IA_MODELO = 'llama-3.3-70b-versatile';

function gOpenIA() {
  document.getElementById('mIA').classList.add('show');
  document.getElementById('iaConfigWrap').classList.toggle('hidden', !!localStorage.getItem('spg_groq_key'));
  document.getElementById('iaPergunta').focus();
}

function gAbrirConfigIA() {
  const wrap = document.getElementById('iaConfigWrap');
  const estavaEscondido = wrap.classList.contains('hidden');
  wrap.classList.toggle('hidden');
  if (estavaEscondido) document.getElementById('iaApiKey').focus();
}

function gSalvarChaveIA() {
  const key = document.getElementById('iaApiKey').value.trim();
  if (!key) { toast('Digite a chave.', 'error'); return; }
  localStorage.setItem('spg_groq_key', key);
  document.getElementById('iaApiKey').value = '';
  document.getElementById('iaConfigWrap').classList.add('hidden');
  toast('Chave salva neste navegador!', 'success');
}

function _iaAdicionarMensagem(texto, tipo) {
  const wrap = document.getElementById('iaMensagens');
  const el = document.createElement('div');
  const estiloUser = 'align-self:flex-end;background:var(--verde);color:#fff;';
  const estiloIA   = 'align-self:flex-start;background:#f1f5f9;color:#1e293b;';
  const estiloErro  = 'align-self:flex-start;background:#fee2e2;color:#b91c1c;';
  el.style.cssText = `max-width:85%;padding:10px 14px;border-radius:14px;font-size:13px;white-space:pre-wrap;line-height:1.4;${
    tipo === 'user' ? estiloUser : tipo === 'erro' ? estiloErro : estiloIA}`;
  el.textContent = texto;
  wrap.appendChild(el);
  wrap.scrollTop = wrap.scrollHeight;
  return el;
}

function gPerguntarIA() {
  const input = document.getElementById('iaPergunta');
  const pergunta = input.value.trim();
  if (!pergunta) return;
  const key = localStorage.getItem('spg_groq_key');
  if (!key) { gAbrirConfigIA(); toast('Configure a chave da API primeiro.', 'error'); return; }
  const btn = document.getElementById('iaBtnPerguntar');

  _iaAdicionarMensagem(pergunta, 'user');
  input.value = '';
  const msgCarregando = _iaAdicionarMensagem('Pensando...', 'ia');
  btn.disabled = true;

  gs('obterContextoIA', App.token)
    .then(ctx => fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
      body: JSON.stringify({
        model: IA_MODELO,
        temperature: 0.2,
        messages: [
          { role: 'system', content:
            'Você é o assistente do sistema SPG de controle de transplantio e entrega de brócolis. ' +
            'Responda em português, de forma direta e objetiva, usando SOMENTE os dados fornecidos abaixo. ' +
            'Os dados têm duas seções: "HISTÓRICO REAL DE ENTREGAS" (o que já foi efetivamente entregue e pesado, ' +
            'por parceiro/mês/ano, com kg, unidades, média de g/unidade e número de entregas) e ' +
            '"COLHEITAS PREVISTAS" (plantios feitos que ainda vão ser colhidos, é previsão, não entrega real). ' +
            'Nunca confunda uma com a outra ao responder. ' +
            '"Média da cabeça", "média por cabeça" ou "média por muda" significa a média de g/unidade (peso por muda/unidade entregue). ' +
            'Se a pergunta mencionar um mês sem dizer o ano, use o ano mais recente disponível pra esse mês nos dados, ' +
            'a menos que existam vários anos e fique claro que deveria somar todos — nesse caso, mostre o total e também o detalhamento por ano. ' +
            'Quando a pergunta pedir uma soma, período ou "próximo mês", calcule com cuidado usando as datas ' +
            'informadas (a data de hoje está no topo dos dados). ' +
            'Se não houver dados suficientes para responder com confiança, diga isso claramente em vez de inventar. ' +
            'Formate TODO número igual ou maior que 1000 no padrão brasileiro, com ponto separando milhar (ex.: 9.968, 29.548, 1.200.000) — nunca escreva "9968" sem separador. ' +
            'Essa formatação vale pra QUALQUER número que aparecer na sua resposta, inclusive números que você copiar diretamente dos dados abaixo (eles estão sem separador nos dados brutos — é sua obrigação formatá-los ao escrever a resposta, mesmo em contas intermediárias como "6408 + 3560 = 9968"). ' +
            'Use vírgula para casas decimais quando precisar (ex.: 1.234,5 kg). Isso vale pra kg, unidades e qualquer outro número, mas não pra anos (ex.: 2026 continua sem ponto).\n\n' +
            'DADOS:\n' + ctx.contexto
          },
          { role: 'user', content: pergunta }
        ]
      })
    }))
    .then(async r => {
      const data = await r.json();
      if (!r.ok) throw new Error((data.error && data.error.message) || ('Erro na API da Groq (' + r.status + ').'));
      msgCarregando.textContent = data.choices[0].message.content;
    })
    .catch(e => {
      msgCarregando.textContent = 'Erro: ' + e.message;
      msgCarregando.style.background = '#fee2e2'; msgCarregando.style.color = '#b91c1c';
    })
    .finally(() => { btn.disabled = false; document.getElementById('iaMensagens').scrollTop = 999999; input.focus(); });
}
</script>
<script>
// ── PRD: HISTÓRICO DE ENTREGAS ───────────────────────────────

const MESES_PT = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

function gLoadPRD() {
  const ano      = (document.getElementById('prdFAno') || {}).value || '';
  const mes      = (document.getElementById('prdFMes') || {}).value || '';
  const parceiro = (document.getElementById('prdFPa')  || {}).value || '';
  const classe   = (document.getElementById('prdFCl')  || {}).value || '';

  const stats = document.getElementById('prdStats');
  if (stats) stats.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:16px;color:#94a3b8;font-size:12px;">Carregando dados PRD...</div>';

  Promise.all([
    gsPRD('getEntregasDashboard', App.token, { ano, mes, parceiro, classe }),
    gsPRD('getProjecaoSemanal',   App.token)
  ])
    .then(([d, proj]) => gDashPRD(d, proj))
    .catch(e => {
      if (stats) stats.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:16px;color:#dc2626;font-size:12px;">Erro PRD: ${e.message}</div>`;
    });
}

function gDashPRD(d, proj) {
  // ── atualiza filtros ────────────────────────────────────────
  ['prdFAno','prdFMes','prdFPa','prdFCl'].forEach((id, i) => {
    const el = document.getElementById(id); if (!el) return;
    const curr = el.value;
    const lista = [d.anos, d.meses, d.parceiros, d.classes][i] || [];
    el.innerHTML = `<option value="">${['Todos','Todos','Todos','Todas'][i]}</option>`;
    lista.forEach(v => {
      const o = document.createElement('option');
      o.value = v; o.textContent = id === 'prdFMes' ? (MESES_PT[v - 1] || v) : v;
      el.appendChild(o);
    });
    if (curr) el.value = curr;
  });

  // ── stats ───────────────────────────────────────────────────
  const r = d.resumo;
  const stats = document.getElementById('prdStats');
  if (stats) stats.innerHTML = `
    <div class="stat-card"><div class="stat-value stat-verde">${fmtKg(r.total_kg)}</div><div class="stat-label">Total KG</div></div>
    <div class="stat-card"><div class="stat-value stat-azul">${fmtNum(r.total_unidades)}</div><div class="stat-label">Unidades</div></div>
    <div class="stat-card"><div class="stat-value stat-ambar">${fmtKg(r.media_kg_dia)}</div><div class="stat-label">Média KG/Dia</div></div>
    <div class="stat-card"><div class="stat-value stat-ambar">${fmtKg(r.media_kg_semana)}</div><div class="stat-label">Média KG/Semana</div></div>
    <div class="stat-card"><div class="stat-value stat-verde">${r.media_g_un ? r.media_g_un + ' g' : '--'}</div><div class="stat-label">Média g/Unidade</div></div>
    <div class="stat-card"><div class="stat-value stat-azul">${fmtNum(r.dias_com_entrega)}</div><div class="stat-label">Dias c/ Entrega</div></div>
    <div class="stat-card"><div class="stat-value stat-verde">${r.total_parceiros}</div><div class="stat-label">Parceiros</div></div>
  `;

  // ── gráfico: KG por dia (últimos 90 dias) ──────────────────
  if (Gerente.cPRDDia) Gerente.cPRDDia.destroy();
  const cd = document.getElementById('cPRDDia');
  if (cd) {
    const dias = d.porDia.slice(-90);
    const lbl  = document.getElementById('prdDiaLabel');
    if (lbl) lbl.textContent = dias.length < d.porDia.length ? `(últimos ${dias.length} dias)` : `(${dias.length} dias)`;
    // média móvel 7 dias
    const media7 = dias.map((_, i) => {
      const slice = dias.slice(Math.max(0, i - 6), i + 1);
      return +(slice.reduce((s, x) => s + x.peso_kg, 0) / slice.length).toFixed(1);
    });
    Gerente.cPRDDia = new Chart(cd, {
      type: 'line',
      data: {
        labels: dias.map(x => fmtDate(x.data)),
        datasets: [
          {
            label: 'KG/dia',
            data: dias.map(x => x.peso_kg),
            borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,.08)',
            borderWidth: 1.5, pointRadius: 1.5, fill: true, tension: 0.2, order: 2
          },
          {
            label: 'Média 7d',
            data: media7,
            borderColor: '#f59e0b', backgroundColor: 'transparent',
            borderWidth: 2, pointRadius: 0, fill: false, tension: 0.4, borderDash: [4, 3], order: 1
          }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: { legend: { position: 'bottom', labels: { font: { size: 10 }, padding: 10 } } },
        scales: {
          x: { ticks: { font: { size: 9 }, color: '#94a3b8', maxTicksLimit: 12 }, grid: { display: false } },
          y: { ticks: { font: { size: 10 }, color: '#94a3b8' }, grid: { color: '#f1f5f9' } }
        }
      }
    });
  }

  // ── gráfico: KG por semana + projeção ─────────────────────
  if (Gerente.cPRDSem) Gerente.cPRDSem.destroy();
  const cs = document.getElementById('cPRDSem');
  if (cs) {
    // usa dados combinados (proj) se disponível, senão apenas histórico
    const semData = proj && proj.length
      ? proj.slice(-40)
      : d.porSemana.slice(-24).map(s => ({ label: s.label, historico: s.peso_kg, projecao: 0 }));

    // linha de média histórica
    const histVals  = semData.map(x => x.historico || 0).filter(v => v > 0);
    const mediaHist = histVals.length ? +(histVals.reduce((s, v) => s + v, 0) / histVals.length).toFixed(1) : 0;

    Gerente.cPRDSem = new Chart(cs, {
      type: 'bar',
      data: {
        labels: semData.map(x => x.label),
        datasets: [
          {
            label: 'KG Entregue',
            data: semData.map(x => x.historico || 0),
            backgroundColor: '#16a34a', borderRadius: 3, order: 2
          },
          {
            label: 'KG Projetado (Transplantios)',
            data: semData.map(x => x.projecao || 0),
            backgroundColor: 'rgba(234,179,8,.65)', borderRadius: 3, order: 3
          },
          {
            label: `Média histórica (${fmtKg(mediaHist)}/sem)`,
            data: semData.map(() => mediaHist),
            type: 'line', borderColor: '#dc2626', borderWidth: 2,
            pointRadius: 0, fill: false, borderDash: [5, 4], order: 1
          }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: { legend: { position: 'bottom', labels: { font: { size: 10 }, padding: 10 } } },
        scales: {
          x: { ticks: { font: { size: 9 }, color: '#94a3b8', maxRotation: 45 }, grid: { display: false } },
          y: { ticks: { font: { size: 10 }, color: '#94a3b8' }, grid: { color: '#f1f5f9' } }
        }
      }
    });
  }

  // ── tabela por parceiro (só se filtro "Todos") ─────────────
  const card = document.getElementById('prdPaCard');
  const tb   = document.getElementById('prdTPa');
  if (card && tb && d.porParceiro.length > 1) {
    card.style.display = '';
    tb.innerHTML = d.porParceiro.map(p =>
      `<tr><td><strong>${p.parceiro}</strong></td><td>${fmtKg(p.peso_kg)}</td><td>${fmtNum(p.unidades)}</td><td>${p.media_g_un ? p.media_g_un + ' g' : '--'}</td></tr>`
    ).join('');
  } else if (card) {
    card.style.display = 'none';
  }
}
</script>
